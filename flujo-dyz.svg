<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">De la venta a la entrega</title><desc id="desc">Diagrama de cinco etapas del sistema de operación comercial.</desc><rect width="1440" height="900" fill="#EADFCF"/><g font-family="Arial,sans-serif"><text x="86" y="100" fill="#073119" font-size="19" letter-spacing="3">DISTRIESTETICYZ / FLUJO FUNCIONAL</text><text x="86" y="200" fill="#073119" font-size="58" font-weight="bold">Cada pedido, con historia.</text><text x="86" y="250" fill="#073119" font-size="24">Coordinar la operación desde un mismo recorrido.</text><path d="M170 429H1270" stroke="#F23F0D" stroke-width="3"/><g fill="#073119"><rect x="86" y="350" width="228" height="158"/><rect x="346" y="350" width="228" height="158"/><rect x="606" y="350" width="228" height="158"/><rect x="866" y="350" width="228" height="158"/><rect x="1126" y="350" width="228" height="158"/></g><g fill="#d0e7a1" font-size="16"><text x="110" y="388">01</text><text x="370" y="388">02</text><text x="630" y="388">03</text><text x="890" y="388">04</text><text x="1150" y="388">05</text></g><g fill="#F8F6F3" font-size="28"><text x="110" y="452">Venta</text><text x="370" y="452">Bodega</text><text x="630" y="452">Empaque</text><text x="890" y="452">Despacho</text><text x="1150" y="452">Entrega</text></g><path d="M200 525v65h1040v-65M720 590v46" stroke="#F23F0D" stroke-width="2" fill="none"/><rect x="310" y="636" width="820" height="90" fill="#F8F6F3"/><text x="720" y="690" text-anchor="middle" fill="#073119" font-size="24">Inventario · permisos · historial · seguimiento</text><text x="86" y="822" fill="#073119" font-size="18">Esquema explicativo · no representa una pantalla de producción</text></g></svg>